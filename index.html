
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10130f">
  <title>PONTUAK FEST 2026 | Crew Dashboard</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at top, #293b25 0%, transparent 60%),
        #10130f;
      color: #f5f5f0;
    }

    main {
      width: min(460px, 100%);
      padding: 32px 24px;
      text-align: center;
      background: #191e17;
      border: 1px solid #394532;
      border-radius: 20px;
      box-shadow: 0 20px 70px #0007;
    }

    .brand {
      color: #b7d68a;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(26px, 6vw, 36px);
    }

    p {
      color: #c5cdbd;
      line-height: 1.6;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin: 26px 0 18px;
      min-height: 42px;
    }

    #status {
      min-height: 44px;
      padding: 12px;
      border-radius: 10px;
      background: #242c20;
      color: #d5e8c3;
      font-size: 13px;
      line-height: 1.5;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca595;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">PONTUAK FEST 2026</div>
    <h1>Crew Dashboard</h1>
    <p>Portal koordinasi tugas dan tim PONTUAK FEST.</p>

    <div id="googleButton"></div>

    <div id="status" role="status" aria-live="polite">
      Menyiapkan login Google...
    </div>

    <p class="note">
      Login belum memberikan akses ke data tugas.
      Akses akan dibuka setelah verifikasi server selesai.
    </p>
  </main>

  <script>
    const GOOGLE_CLIENT_ID =
      '786462609526-7up36a2dbmfitkua7h8aovu7k7nroolq.apps.googleusercontent.com';

    // Token hanya berada di memori halaman selama pengujian.
    // Jangan menyimpan token atau mengirimkannya ke log.
    let temporaryGoogleCredential = null;

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function handleGoogleCredential(response) {
      if (!response || !response.credential) {
        setStatus('Login tidak menghasilkan kredensial. Silakan coba lagi.');
        return;
      }

      temporaryGoogleCredential = response.credential;

      setStatus(
        'Login Google berhasil menghasilkan token. ' +
        'Identitas dan hak akses belum diverifikasi oleh backend.'
      );

      // Belum ada panggilan API atau akses ke spreadsheet.
    }

    function initializeGoogleLogin() {
      if (!window.google || !google.accounts || !google.accounts.id) {
        setStatus(
          'Layanan login Google belum termuat. Periksa koneksi internet, lalu muat ulang halaman.'
        );
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential
      });

      google.accounts.id.renderButton(
        document.getElementById('googleButton'),
        {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
          width: 280,
          logo_alignment: 'left'
        }
      );

      setStatus('Silakan login menggunakan akun Google Anda.');
    }

    window.addEventListener('load', initializeGoogleLogin);
  </script>
</body>
</html>
